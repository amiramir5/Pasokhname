<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C5DFA" />
      <stop offset="55%" stop-color="#6338F9" />
      <stop offset="100%" stop-color="#4318D1" />
    </linearGradient>
    <linearGradient id="sheetGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F3EEFF" />
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#1E105A" flood-opacity="0.28" />
    </filter>
  </defs>

  <!-- پس‌زمینه بنفش با گوشه‌های گرد استاندارد آیکون اپ -->
  <rect x="0" y="0" width="512" height="512" rx="116" fill="url(#bgGrad)" />

  <!-- دایره‌های نوری ملایم پس‌زمینه -->
  <circle cx="410" cy="102" r="95" fill="#9E82FF" opacity="0.22" />
  <circle cx="96" cy="420" r="110" fill="#3611AD" opacity="0.25" />

  <!-- برگه پاسخبرگ سفید در مرکز -->
  <g filter="url(#softShadow)">
    <rect x="116" y="88" width="280" height="336" rx="34" fill="url(#sheetGrad)" />
    <!-- گیره بالای پاسخبرگ -->
    <rect x="196" y="66" width="120" height="38" rx="16" fill="#2E1065" />
    <rect x="226" y="78" width="60" height="14" rx="7" fill="#A78BFA" />

    <!-- ردیف ۱ پاسخبرگ: گزینه تیک‌خورده بنفش -->
    <circle cx="342" cy="166" r="20" fill="#6338F9" />
    <path d="M333 166 l6 6 l12 -13" stroke="#FFFFFF" stroke-width="5.5" fill="none" stroke-linecap="round" stroke-linejoin="round" />
    <rect x="156" y="154" width="150" height="24" rx="12" fill="#E2D9FF" />

    <!-- ردیف ۲ پاسخبرگ: گزینه تیک‌خورده سبز (پاسخ صحیح) -->
    <circle cx="342" cy="236" r="20" fill="#10B981" />
    <path d="M333 236 l6 6 l12 -13" stroke="#FFFFFF" stroke-width="5.5" fill="none" stroke-linecap="round" stroke-linejoin="round" />
    <rect x="180" y="224" width="126" height="24" rx="12" fill="#D1FAE5" />

    <!-- ردیف ۳ پاسخبرگ: سوال زمان‌دار زرد (○) -->
    <circle cx="342" cy="306" r="20" fill="#F59E0B" />
    <circle cx="342" cy="306" r="8" fill="#FFFFFF" />
    <rect x="156" y="294" width="150" height="24" rx="12" fill="#FEF3C7" />

    <!-- ردیف ۴ پاسخبرگ: حباب‌های چهارگزینه‌ای -->
    <circle cx="342" cy="370" r="13" fill="#EDE9FE" stroke="#7C3AED" stroke-width="3.5" />
    <circle cx="292" cy="370" r="13" fill="#6338F9" />
    <circle cx="242" cy="370" r="13" fill="#EDE9FE" stroke="#7C3AED" stroke-width="3.5" />
    <circle cx="192" cy="370" r="13" fill="#EDE9FE" stroke="#7C3AED" stroke-width="3.5" />
  </g>
</svg>
